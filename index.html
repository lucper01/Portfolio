  <meta name="twitter:image" content="https://lucper01.github.io/Portfolio/assets/photo-profil.png" />

  <title>Luc Perroquin | Portfolio académique</title>

  <style>
    :root {
      --page-width: 1320px;
      --green-deep: #061f17;
      --green-dark: #0b2f23;
      --green-main: #1f6f50;
      --green-light: #77b892;
      --green-soft: #dceee3;
      --green-pale: #f3faf5;
      --cream: #fbf7ed;
      --text: #1d261f;
      --muted: #5f6f65;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(11, 47, 35, 0.16);
      --shadow-soft: 0 12px 30px rgba(11, 47, 35, 0.10);
      --radius-large: 32px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(119, 184, 146, 0.22), transparent 32%),
        radial-gradient(circle at 90% 30%, rgba(220, 238, 227, 0.55), transparent 34%),
        linear-gradient(180deg, var(--cream), var(--green-pale));
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      --green-deep: #03100c;
      --green-dark: #dceee3;
      --green-main: #77b892;
      --green-light: #9fd3b1;
      --green-soft: #193f2e;
      --green-pale: #0b1f17;
      --cream: #07130f;
      --text: #edf8f0;
      --muted: #b8cabc;
      --white: #10251c;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
      --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.22);
      background:
        radial-gradient(circle at 10% 0%, rgba(119, 184, 146, 0.16), transparent 32%),
        radial-gradient(circle at 90% 30%, rgba(31, 111, 80, 0.18), transparent 34%),
        linear-gradient(180deg, #07130f, #0b1f17);
    }

    a {
      color: var(--green-main);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover { text-decoration: underline; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2000;
      transform: translateY(-140%);
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b2f23;
      font-weight: 900;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .top-controls {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .control-group {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(251, 247, 237, 0.96);
      border: 1px solid rgba(11, 47, 35, 0.14);
      box-shadow: 0 10px 30px rgba(11, 47, 35, 0.18);
      backdrop-filter: blur(10px);
    }

    body.dark-mode .control-group {
      background: rgba(7, 19, 15, 0.92);
      border-color: rgba(220, 238, 227, 0.18);
    }

    .control-group button {
      border: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: transparent;
      color: #0b2f23;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }

    body.dark-mode .control-group button { color: #dceee3; }

    .control-group button.active {
      background: var(--green-main);
      color: #ffffff;
    }
.accessibility-panel {
      position: fixed;
      top: 78px;
      right: 18px;
      z-index: 1100;
      width: min(360px, calc(100vw - 36px));
      padding: 18px;
      border-radius: 24px;
      background: rgba(251, 247, 237, 0.98);
      border: 1px solid rgba(11, 47, 35, 0.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    body.dark-mode .accessibility-panel {
      background: rgba(7, 19, 15, 0.98);
      border-color: rgba(220, 238, 227, 0.18);
    }

    .accessibility-panel[hidden] { display: none; }

    .accessibility-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .accessibility-header h2 {
      font-size: 1.2rem;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .accessibility-close {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .accessibility-intro {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .accessibility-options {
      display: grid;
      gap: 10px;
    }

    .accessibility-option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border-radius: 16px;
      background: var(--green-pale);
      border: 1px solid rgba(11, 47, 35, 0.10);
      cursor: pointer;
    }

    body.dark-mode .accessibility-option {
      background: rgba(119, 184, 146, 0.10);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .accessibility-option input {
      width: 20px;
      height: 20px;
      accent-color: var(--green-main);
      margin-top: 2px;
    }

    .accessibility-option strong {
      color: var(--green-dark);
      display: block;
      font-size: 0.95rem;
    }

    .accessibility-option small {
      color: var(--muted);
      display: block;
      line-height: 1.35;
      margin-top: 2px;
    }

    header {
      min-height: 88vh;
      display: grid;
      place-items: center;
      padding: 82px 8% 76px;
      color: #ffffff;
      background:
        radial-gradient(circle at top right, rgba(220, 238, 227, 0.28), transparent 30%),
        radial-gradient(circle at bottom left, rgba(119, 184, 146, 0.22), transparent 34%),
        linear-gradient(135deg, #061f17, #0b2f23 46%, #1f6f50);
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -160px;
      bottom: -160px;
      border-radius: 50%;
      background: rgba(220, 238, 227, 0.12);
      filter: blur(8px);
    }

    .hero {
      width: 100%;
      max-width: var(--page-width);
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(280px, 0.82fr);
      gap: 54px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .label {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #dceee3;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5.6vw, 4.35rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
      max-width: 850px;
    }

    .subtitle {
      margin: 0 0 18px;
      color: #dceee3;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 700;
      max-width: 760px;
    }

    .hero p {
      max-width: 760px;
      font-size: 1.12rem;
      color: rgba(255, 255, 255, 0.86);
    }

    .portrait-card {
      padding: 18px;
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transform: rotate(1.2deg);
    }

    .portrait-link { display: block; }

    .profile-photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      border-radius: 24px;
      border: 6px solid #dceee3;
      background: #dceee3;
    }

    .photo-note {
      margin-top: 12px;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
      font-weight: 750;
    }

    .portrait-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .portrait-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: #dceee3;
      color: #0b2f23;
      font-size: 0.88rem;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.36);
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .portrait-button:hover {
      text-decoration: none;
      transform: translateY(-2px);
      background: #ffffff;
      color: #0b2f23;
    }

    .portrait-button.secondary {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .portrait-button.secondary:hover {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    nav.site-nav {
      position: relative;
      z-index: 20;
      padding: 10px 6%;
      background: rgba(251, 247, 237, 0.94);
      border-bottom: 1px solid rgba(11, 47, 35, 0.12);
      backdrop-filter: blur(10px);
    }

    body.dark-mode nav.site-nav {
      background: rgba(7, 19, 15, 0.94);
      border-bottom-color: rgba(220, 238, 227, 0.12);
    }

    .nav-inner {
      max-width: var(--page-width);
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .nav-toggle {
      display: none;
      border: 1px solid rgba(11, 47, 35, 0.18);
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--white);
      color: var(--green-dark);
      font-weight: 800;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    nav.site-nav a {
      color: var(--green-dark);
      font-size: 0.93rem;
      padding: 6px 10px;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    nav.site-nav a.active {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    body.dark-mode nav.site-nav a.active {
      background: rgba(119, 184, 146, 0.22);
      color: #dceee3;
    }

    .side-progress {
      position: fixed;
      right: 18px;
      top: 50%;
      z-index: 900;
      transform: translateY(-50%);
      display: grid;
      gap: 6px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      padding: 10px;
      border-radius: 22px;
      background: rgba(251, 247, 237, 0.92);
      border: 1px solid rgba(11, 47, 35, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      scrollbar-width: thin;
    }

    body.dark-mode .side-progress {
      background: rgba(7, 19, 15, 0.88);
      border-color: rgba(220, 238, 227, 0.14);
    }

    .side-progress a {
      --section-progress: 0%;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 8px;
      min-width: 170px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.2;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .side-progress a:hover {
      text-decoration: none;
      transform: translateX(-2px);
      background: rgba(119, 184, 146, 0.12);
      color: var(--green-dark);
    }

    .side-progress a span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--green-pale);
      color: var(--green-main);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .side-progress a.active {
      background:
        linear-gradient(
          90deg,
          var(--green-dark) 0 var(--section-progress),
          var(--green-main) var(--section-progress) 100%
        );
      color: #ffffff;
    }

    .side-progress a.active span {
      background: #ffffff;
      color: var(--green-main);
    }

    body.dark-mode .side-progress a.active span {
      background: #dceee3;
      color: #0b2f23;
    }

    .portfolio-search {
      position: sticky;
      top: 0;
      z-index: 18;
      max-width: var(--page-width);
      margin: 18px auto 0;
      padding: 0 6%;
      transition: margin 0.2s ease, transform 0.2s ease;
    }

    body.search-compact .portfolio-search {
      margin-top: 8px;
    }

    .search-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 999px;
      background: rgba(251, 247, 237, 0.92);
      border: 1px solid rgba(11, 47, 35, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      transition: padding 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    body.search-compact .search-card {
      padding: 7px 10px;
      box-shadow: 0 12px 28px rgba(11, 47, 35, 0.16);
      border-color: rgba(25, 97, 68, 0.22);
    }

    body.dark-mode .search-card {
      background: rgba(7, 19, 15, 0.88);
      border-color: rgba(220, 238, 227, 0.14);
    }

    .search-card input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 750;
      outline: none;
      padding: 8px 12px;
      transition: padding 0.2s ease, font-size 0.2s ease;
    }

    body.search-compact .search-card input {
      padding: 4px 10px;
      font-size: 0.92rem;
    }

    .search-card input::placeholder { color: var(--muted); }

    .search-card button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, padding 0.2s ease;
    }

    .search-card button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--green-main);
      color: #ffffff;
    }

    body.search-compact .search-card button {
      padding: 6px 10px;
    }

    .search-card.search-feedback {
      border-color: var(--green-main);
      box-shadow: 0 12px 30px rgba(25, 97, 68, 0.22);
    }

    .search-nav-button {
      min-width: 38px;
    }

    .search-nav-button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .search-result {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 12px 4px;
      font-weight: 800;
      transition: font-size 0.2s ease, padding 0.2s ease;
    }

    body.search-compact .search-result {
      font-size: 0.78rem;
      padding: 0 10px 2px;
    }

    .search-hidden { display: none !important; }

    .search-focus {
      outline: 3px solid var(--green-main);
      outline-offset: 4px;
    }

    body.dark-mode .search-focus {
      outline-color: #fbf7ed;
    }

    .search-highlight {
      padding: 0 0.12em;
      border-radius: 0.28em;
      background: #fff09a;
      color: #061f17;
      font-weight: 900;
    }

    body.dark-mode .search-highlight {
      background: #fbf7ed;
      color: #061f17;
    }

    main {
      max-width: var(--page-width);
      margin: auto;
      padding: 76px 6% 92px;
    }

    section {
      margin-bottom: 82px;
      scroll-margin-top: 90px;
    }

    .section-title {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 26px;
      align-items: start;
      margin-bottom: 26px;
    }

    .section-title span {
      color: var(--green-main);
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
      padding-top: 8px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--green-dark);
      font-size: clamp(1.8rem, 3vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.025em;
    }

    h3 {
      color: var(--green-dark);
      margin-top: 0;
    }

    .section-title h2 {
      position: relative;
      width: fit-content;
      transition: transform 0.22s ease, color 0.22s ease;
    }

    .section-title h2::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 3px;
      border-radius: 999px;
      background: var(--green-main);
      transition: width 0.22s ease;
    }

    .section-title:hover h2 {
      transform: translateX(4px);
      color: var(--green-main);
    }

    .section-title:hover h2::after {
      width: 100%;
    }
    .hero-title-fr {
      max-width: 1100px;
      font-size: clamp(2.1rem, 4.6vw, 3.95rem);
      letter-spacing: -0.055em;
    }

    .lead {
      max-width: 900px;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .highlight {
      padding: 36px;
      border-radius: 30px;
      color: #ffffff;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.14), transparent 28%),
        linear-gradient(135deg, #0b2f23, #1f6f50);
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .highlight h3 {
      color: #ffffff;
      text-wrap: balance;
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 1.55vw, 1.75rem);
      line-height: 1.08;
    }

    .highlight p { color: rgba(255, 255, 255, 0.88); }

    .subsection-heading {
      margin: 36px 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      color: var(--green-dark);
    }

    .team-card,
    .supervision-card,
    .axis-card,
    .project-card,
    .training-card,
    .training-summary,
    .training-master,
    .publication-list li,
    .contact-box {
      box-shadow: var(--shadow-soft);
      min-width: 0;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .team-card,
    .supervision-card,
    .axis-card,
    .training-summary,


    .recruitment-intro {
      margin-bottom: 24px;
    }

    .recruitment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .recruitment-card {
      padding: 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(11, 47, 35, 0.12);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .recruitment-card:hover {
      transform: translateY(-3px);
      border-color: var(--green-main);
      box-shadow: var(--shadow);
    }

    .recruitment-card.is-closed {
      border-style: dashed;
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.16), transparent 34%),
        rgba(255, 255, 255, 0.90);
    }

    body.dark-mode .recruitment-card {
      background: rgba(16, 37, 28, 0.88);
      border-color: rgba(220, 238, 227, 0.12);
    }

    body.dark-mode .recruitment-card.is-closed {
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.16), transparent 34%),
        rgba(16, 37, 28, 0.88);
    }

    .recruitment-header {
      display: flex;
      align-items: flex-start;

    /* ============================================================
       Ergonomie + esthétique : section panels, respiration, boutons.
       ============================================================ */

    :root {
      --section-radius: 38px;
      --card-radius: 28px;
      --inner-padding: clamp(22px, 3vw, 42px);
    }

    main {
      padding-top: 58px;
    }

    main > section {
      position: relative;
      margin-bottom: 46px;
      padding: var(--inner-padding);
      border-radius: var(--section-radius);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(243, 250, 245, 0.74));
      border: 1px solid rgba(11, 47, 35, 0.10);
      box-shadow: 0 18px 48px rgba(11, 47, 35, 0.095);
      overflow: hidden;
      scroll-margin-top: 124px;
    }

    main > section::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: linear-gradient(180deg, var(--green-main), var(--green-light));
      opacity: 0.82;
    }

    main > section::after {
      content: "";
      position: absolute;
      right: -120px;
      top: -120px;
      width: 280px;
      height: 280px;
      border-radius: 999px;
      background: rgba(119, 184, 146, 0.12);
      pointer-events: none;
    }

    main > section > * {
      position: relative;
      z-index: 1;
    }

    body.dark-mode main > section {
      background:
        linear-gradient(135deg, rgba(16, 37, 28, 0.92), rgba(11, 31, 23, 0.82));
      border-color: rgba(220, 238, 227, 0.12);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.26);
    }

    .section-title {
      align-items: center;
      margin-bottom: 30px;
    }

    .section-title span {
      display: inline-flex;
      width: fit-content;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      line-height: 1;
    }

    .lead {
      max-width: 980px;
      margin-top: 0;
      margin-bottom: 22px;
    }

    .team-card,
    .supervision-card,
    .axis-card,
    .project-card,
    .training-card,
    .training-summary,
    .training-master,
    .publication-list li,
    .contact-box,
    .recruitment-card {
      border-radius: var(--card-radius) !important;
      border: 1px solid rgba(11, 47, 35, 0.11);
      box-shadow: var(--shadow-soft);
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.12), transparent 34%),
        rgba(255, 255, 255, 0.92);
      overflow: hidden;
    }

    .team-card,
    .axis-card,
    .training-summary,
    .contact-box,
    .publication-list li {
      padding: clamp(20px, 2.4vw, 32px);
    }

    .supervision-card {
      padding: clamp(18px, 2.2vw, 28px);
    }

    .axis-card {

        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(243, 250, 245, 0.92));
    }

    .project-card,
    .training-card,

      font-weight: 950;
      letter-spacing: 0.08em;

      color: var(--green-dark);

      box-shadow: 0 18px 44px rgba(31, 111, 80, 0.18);

    }

    .recruitment-card.status-full,
    .recruitment-card.status-finished {
      border-style: dashed;
    }

      margin-top: auto;
      padding-top: 18px;
    }

    .recruitment-link {
      letter-spacing: -0.01em;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeHtmlFrenchPunctuation(value) {
      return escapeHtml(value).replace(/\s([?!:;])/g, "&#160;$1");
    }

    function normalizeSearchText(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function slug(text) {
      return normalizeSearchText(text)
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function recruitmentDocumentCandidates(projectName, documentType) {
      const baseName = `${projectName}_${documentType}`;
      const directory = "assets/participer";

      const extensions = documentType === "Affiche"
        ? ["pdf", "png", "jpg", "jpeg"]
        : ["pdf", "docx"];

      return extensions.map((extension) => `${directory}/${baseName}.${extension}`);
    }

    async function urlExists(url) {
      try {
        const response = await fetch(url, { method: "HEAD", cache: "no-store" });
        return response.ok;
      } catch {
        return false;
      }
    }

    async function findFirstExistingUrl(urls) {
      for (const url of urls) {
        if (await urlExists(url)) {
          return url;
        }
      }

      return null;
    }


    function getRecruitmentConfig(project) {

      return {
        status: defaultStatus,
        questionnaire: "",
        planning: "",
        ...(RECRUITMENT_CONFIG[project.name] || {})
      };
    }

    function getRecruitmentStatusLabel(project, data) {
      const status = getRecruitmentConfig(project).status;
      return data.recruitmentStatusLabels?.[status] || data.recruitmentStatusClosed;
    }

    function getRecruitmentStatusText(project, data) {
      const status = getRecruitmentConfig(project).status;
      return data.recruitmentStatusTexts?.[status] || data.recruitmentClosedText;
    }

      const value = getRecruitmentConfig(project)[key];
      return typeof value === "string" ? value.trim() : "";

      return axisNumber === 1

        : (currentLanguage === "fr" ? "Influence des odeurs sur la perception de l'espace et des événements" : "Influence of odors on the perception of space and events");
    }

    function axisDescription(axisNumber) {
      return axisNumber === 1
        ? (currentLanguage === "fr"
          ? "Cet axe vise à caractériser les relations temporelles entre modalités sensorielles, puis à examiner comment l'olfaction peut modifier les fenêtres d'intégration et leur recalibration."
          : "This axis aims to characterize temporal relations between sensory modalities, and then to examine how olfaction may modify integration windows and their recalibration.")
        : (currentLanguage === "fr"
          ? "Cet axe vise à caractériser la manière dont les odeurs peuvent moduler la perception visuelle de l'espace, orienter l'attention spatiale et modifier la représentation de scènes ou d'événements."
          : "This axis aims to characterize how odors may modulate visual perception of space, orient spatial attention, and modify the representation of scenes or events.");
    }

    function pluralLabel(count, singularFr, pluralFr, singularEn, pluralEn) {
      if (currentLanguage === "fr") {
        return `${count} ${count > 1 ? pluralFr : singularFr}`;
      }

      return `${count} ${count > 1 ? pluralEn : singularEn}`;
    }

    function parseTeachingHours(value) {
      const match = String(value || "").replace(",", ".").match(/[\d.]+/);
      return match ? Number(match[0]) : 0;
    }

    function getTeachingTotals() {
      const hours = TEACHING.reduce((total, block) => total + parseTeachingHours(block.total), 0);
      const interventions = TEACHING.reduce((total, block) => total + block.entries.length, 0);

      return {
        hours,
        years: TEACHING.length,
        interventions
      };
    }

      const totals = getTeachingTotals();

      return `

    function updateSectionProgressIndicator() {
      document.querySelectorAll(".side-progress a").forEach((link) => {
        link.style.setProperty("--section-progress", "0%");

      if (!currentSectionKey || currentSectionKey === "top") {
        return;
      }

      const section = document.getElementById(sectionId(currentSectionKey));
      const activeLink = document.querySelector(`.side-progress a[data-section-key="${currentSectionKey}"]`);

      if (!section || !activeLink) {
        return;
      }

      const start = section.offsetTop - 140;
      const end = section.offsetTop + section.offsetHeight - window.innerHeight * 0.45;
      const denominator = Math.max(end - start, 1);
      const rawProgress = (window.scrollY - start) / denominator;
      const progress = Math.max(0, Math.min(1, rawProgress));

      activeLink.style.setProperty("--section-progress", `${Math.round(progress * 100)}%`);
    }

      const heroRect = hero.getBoundingClientRect();

      visibleSections.forEach((section) => {

        if (rect.top < window.innerHeight * 0.65 && distance < bestDistance) {

        updateActiveNavigation(bestSection.dataset.section);

    function getAccentInsensitiveMatches(text, query) {
      const normalizedQuery = normalizeSearchText(query);

      if (!normalizedQuery) {
        return [];
      }

      let normalizedText = "";
      const indexMap = [];

      Array.from(text).forEach((char, originalIndex) => {
        const normalizedChar = normalizeSearchText(char);

        Array.from(normalizedChar).forEach((mappedChar) => {
          normalizedText += mappedChar;
          indexMap.push(originalIndex);
        });
      });

      const matches = [];
      let startIndex = normalizedText.indexOf(normalizedQuery);

      while (startIndex !== -1) {
        const endIndex = startIndex + normalizedQuery.length - 1;
        matches.push({
          start: indexMap[startIndex],
          end: indexMap[endIndex] + 1
        });

        startIndex = normalizedText.indexOf(normalizedQuery, startIndex + normalizedQuery.length);
      }

      return matches;
    }

    function clearSearchHighlights() {
      document.querySelectorAll("mark.search-highlight").forEach((mark) => {

      });
    }

    function highlightOccurrencesInElement(element, query) {
      const ignoredTags = new Set(["SCRIPT", "STYLE", "NOSCRIPT", "INPUT", "TEXTAREA", "BUTTON", "MARK"]);
      const walker = document.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            const parent = node.parentElement;

            if (!parent || ignoredTags.has(parent.tagName)) {
              return NodeFilter.FILTER_REJECT;
            }

            if (!normalizeSearchText(node.nodeValue).includes(normalizeSearchText(query))) {
              return NodeFilter.FILTER_REJECT;
            }

            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      let occurrenceCount = 0;

      textNodes.forEach((node) => {
        const text = node.nodeValue;
        const matches = getAccentInsensitiveMatches(text, query);

        if (!matches.length) {
          return;
        }

        occurrenceCount += matches.length;

        const fragment = document.createDocumentFragment();
        let cursor = 0;

        matches.forEach((match) => {
          if (match.start > cursor) {
            fragment.appendChild(document.createTextNode(text.slice(cursor, match.start)));
          }

          const mark = document.createElement("mark");
          mark.className = "search-highlight";
          mark.textContent = text.slice(match.start, match.end);
          fragment.appendChild(mark);

          cursor = match.end;
        });

        if (cursor < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(cursor)));
        }

        node.replaceWith(fragment);
      });

      return occurrenceCount;
    }

    function updateSearchResultCounter() {
      const data = DATA[currentLanguage];
      const resultBox = document.querySelector("[data-search-result]");

      if (!resultBox) return;

      if (!currentSearchResults.length) {
        if (currentSearchOccurrenceCount === 0) {
          const word = data.resultWord[0];
          resultBox.hidden = false;
          resultBox.textContent = `0 ${word}`;
        }

        return;
      }

      const total = currentSearchResults.length;
      const word = total > 1 ? data.resultWord[1] : data.resultWord[0];

      resultBox.hidden = false;
      resultBox.textContent = `${currentSearchIndex + 1} / ${total} · ${total} ${word}`;
    }

    function focusSearchResult(index) {
      if (!currentSearchResults.length) {
        updateSearchNavigationButtons();
        return;
      }

      document.querySelectorAll(".search-focus").forEach((item) => {
        item.classList.remove("search-focus");
      });

      currentSearchIndex = (index + currentSearchResults.length) % currentSearchResults.length;
      const target = currentSearchResults[currentSearchIndex];

      let parentDetails = target.closest("details");

      while (parentDetails) {
        parentDetails.open = true;
        parentDetails = parentDetails.parentElement?.closest("details");
      }

      target.classList.add("search-focus");

      window.setTimeout(() => {
        target.scrollIntoView({
          behavior: "smooth",
          block: "center",
          inline: "nearest"
        });
      }, 80);

      updateSearchNavigationButtons();
      updateSearchResultCounter();
      pulseSearchFeedback();
    }

    function goToSearchResult(direction) {

    function applySiteSearch(rawQuery) {
      const data = DATA[currentLanguage];
      const query = normalizeSearchText(rawQuery);
      const resultBox = document.querySelector("[data-search-result]");
      const searchableItems = document.querySelectorAll(
        ".team-card, .supervision-card, .project-card, .recruitment-card, .training-summary, .training-card, .publication-list li, .contact-item"
      );

      clearSearchHighlights();

      if (query.length < 2) {
        searchableItems.forEach((item) => item.classList.remove("search-hidden"));

        currentSearchOccurrenceCount = 0;
        currentSearchResults = [];
        currentSearchIndex = 0;
        updateSearchNavigationButtons();

        if (resultBox) {
          resultBox.hidden = true;
          resultBox.textContent = "";
        }

        return;
      }

      let visibleItemCount = 0;
      let occurrenceCount = 0;
      let firstMatch = null;

      currentSearchResults = [];
      currentSearchIndex = 0;

      searchableItems.forEach((item) => {
        const itemText = normalizeSearchText(item.textContent);
        const isMatch = itemText.includes(query);

        item.classList.toggle("search-hidden", !isMatch);

        if (isMatch) {
          visibleItemCount += 1;
          occurrenceCount += highlightOccurrencesInElement(item, rawQuery);

          item.querySelectorAll("mark.search-highlight").forEach((mark) => {
            currentSearchResults.push(mark);
          });

          if (!firstMatch) {
            firstMatch = item;
          }
        }
      });

      currentSearchOccurrenceCount = occurrenceCount;

      if (resultBox && !currentSearchResults.length) {
        const word = data.resultWord[0];
        resultBox.hidden = false;
        resultBox.textContent = `0 ${word}`;
      }

      if (currentSearchResults.length) {
        focusSearchResult(0);
      } else {
        updateSearchNavigationButtons();
      }
    }

    function clearSiteSearch() {
      const input = document.querySelector("[data-site-search]");
      if (input) input.value = "";

      currentSearchResults = [];
      currentSearchIndex = 0;
      currentSearchOccurrenceCount = 0;
      updateSearchNavigationButtons();

      clearSearchHighlights();

      document.querySelectorAll(".search-hidden").forEach((item) => {
        item.classList.remove("search-hidden");
      });

      const resultBox = document.querySelector("[data-search-result]");
      if (resultBox) {
        resultBox.hidden = true;
        resultBox.textContent = "";
      }
    }



    function getDocumentExtension(url) {
      return url.split("?")[0].split("#")[0].split(".").pop().toLowerCase();
    }

    function buildDocumentPreviewMarkup(link, url, data) {
      const title = link.dataset.docTitle || link.dataset.defaultLabel || data.recruitmentDocumentOpen;
      const extension = getDocumentExtension(url);
      const isImage = ["png", "jpg", "jpeg", "webp"].includes(extension);
      const isPdf = extension === "pdf";

      const mediaMarkup = isImage
        ? `<img src="${escapeHtml(url)}" alt="${escapeHtml(title)}" loading="lazy" />`
        : isPdf
          ? `<iframe src="${escapeHtml(url)}#toolbar=0&navpanes=0" title="${escapeHtml(title)}" loading="lazy"></iframe>`
          : `<p class="document-preview-unavailable">${escapeHtml(data.recruitmentDocumentPreviewUnavailable)}</p>`;

      return `
        <article class="document-preview-card" data-document-preview-card="${escapeHtml(link.dataset.docPreviewId)}">
          <div class="document-preview-heading">
            <strong>${escapeHtml(title)}</strong>
            <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(data.recruitmentDocumentOpen)}</a>
          </div>
          <div class="document-preview-frame ${isImage ? "is-image" : isPdf ? "is-pdf" : "is-other"}">
            ${mediaMarkup}
          </div>
        </article>
      `;
    }

    function updateDocumentPreview(link, url) {
      const settings = loadAccessibilitySettings();
      const data = DATA[currentLanguage];
      const panel = link.closest(".recruitment-action-panel");
      const area = panel?.querySelector("[data-document-preview-area]");
      const grid = panel?.querySelector("[data-document-preview-grid]");

      if (!area || !grid || !link.dataset.docPreviewId) {
        return;
      }

      if (settings.hideDocumentPreviews) {
        area.hidden = true;
        return;
      }

      const existing = grid.querySelector(`[data-document-preview-card="${CSS.escape(link.dataset.docPreviewId)}"]`);
      const markup = buildDocumentPreviewMarkup(link, url, data);

      if (existing) {
        existing.outerHTML = markup;
      } else {
        grid.insertAdjacentHTML("beforeend", markup);
      }

      area.hidden = !grid.children.length;
    }

    function removeDocumentPreview(link) {
      const panel = link.closest(".recruitment-action-panel");
      const area = panel?.querySelector("[data-document-preview-area]");
      const grid = panel?.querySelector("[data-document-preview-grid]");
      const id = link.dataset.docPreviewId;

      if (!area || !grid || !id) {
        return;
      }

      grid.querySelector(`[data-document-preview-card="${CSS.escape(id)}"]`)?.remove();
      area.hidden = !grid.children.length;
    }

    async function updateRecruitmentDocumentLinks() {
      const links = Array.from(document.querySelectorAll("[data-doc-autolink]"));

      await Promise.all(links.map(async (link) => {
        const candidates = (link.dataset.docCandidates || "")
          .split("|")
          .map((url) => url.trim())
          .filter(Boolean);

        const availableUrl = await findFirstExistingUrl(candidates);

        if (!availableUrl) {
          link.href = "#";
          link.classList.add("is-closed");
          link.classList.remove("is-available");
          link.removeAttribute("target");
          link.removeAttribute("rel");
          link.setAttribute("aria-disabled", "true");
          link.dataset.tooltip = link.dataset.closedLabel;
          removeDocumentPreview(link);
          return;
        }

        link.href = availableUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.classList.remove("is-closed");
        link.classList.add("is-available");
        link.setAttribute("aria-disabled", "false");
        link.dataset.tooltip = link.dataset.openLabel;
        updateDocumentPreview(link, availableUrl);
      }));
    }


    function updateDisabledProjectTooltips() {
      const data = DATA[currentLanguage];

      document.querySelectorAll(".project-link.disabled").forEach((link) => {
        link.dataset.tooltip = data.unavailable;
        link.setAttribute("aria-disabled", "true");
        link.setAttribute("title", data.unavailable);
      });

      document.querySelectorAll(".recruitment-link.is-closed").forEach((link) => {
        link.dataset.tooltip = data.recruitmentClosedText;
        link.setAttribute("aria-disabled", "true");
        link.setAttribute("title", data.recruitmentClosedText);
      });
    }


    function handleParticipateLink(event, link) {
      const projectName = link.dataset.participateLink;
      const target = document.getElementById(`${currentLanguage}-participate-${slug(projectName)}`);

      if (!target) {
        return;
      }

      event.preventDefault();

      document.querySelectorAll(".recruitment-focus").forEach((item) => {
        item.classList.remove("recruitment-focus");
      });

      target.classList.add("recruitment-focus");
      target.scrollIntoView({
        behavior: "smooth",
        block: "center",
        inline: "nearest"
      });

      window.history.replaceState(null, "", `#${currentLanguage}-participate-${slug(projectName)}`);

      window.setTimeout(() => {
        target.classList.remove("recruitment-focus");
      }, 2000);
    }

    function openOrCloseAxisProjects(button) {
      const targetAxis = document.getElementById(button.dataset.axisTarget);
      if (!targetAxis) return;

      const shouldOpen = button.dataset.axisAction === "open";
      const projectsPanel = targetAxis.querySelector(".axis-projects-panel");

      if (projectsPanel && shouldOpen) {
        projectsPanel.open = true;
      }

      targetAxis.querySelectorAll(".project-card").forEach((project) => {
        project.open = shouldOpen;
      });
    }

    function closeMobileNavigation() {
      document.querySelectorAll("nav.site-nav.open").forEach((nav) => nav.classList.remove("open"));
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.top = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand("copy");
      document.body.removeChild(textArea);
    }

    async function sharePortfolio() {
      const data = DATA[currentLanguage];
      const shareUrl = window.location.href.split("#")[0];

      const shareData = {
        title: data.title,
        text: data.description,
        url: shareUrl
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await copyTextToClipboard(shareUrl);
          updateShareButtonLabel("copied");
          window.clearTimeout(shareTimeout);
          shareTimeout = window.setTimeout(updateShareButtonLabel, 1800);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          await copyTextToClipboard(shareUrl);
          updateShareButtonLabel("copied");
          window.clearTimeout(shareTimeout);
          shareTimeout = window.setTimeout(updateShareButtonLabel, 1800);
        }
      }
    }
    function loadAccessibilitySettings() {
      try {
        return JSON.parse(localStorage.getItem("portfolio-accessibility")) || {};
      } catch {
        return {};
      }
    }

    function applyAccessibilitySettings(settings, save = true) {
      Object.entries(accessibilityClasses).forEach(([key, className]) => {
        const isActive = Boolean(settings[key]);
        document.body.classList.toggle(className, isActive);

        const control = document.querySelector(`[data-accessibility-option="${key}"]`);
        if (control) {
          control.checked = isActive;
        }
      });

      const hideDocumentPreviews = Boolean(settings.hideDocumentPreviews);
      document.body.classList.toggle("hide-document-previews", hideDocumentPreviews);

      const previewControl = document.querySelector('[data-accessibility-option="hideDocumentPreviews"]');
      if (previewControl) {
        previewControl.checked = hideDocumentPreviews;
      }

      document.querySelectorAll("[data-document-preview-area]").forEach((area) => {
        area.hidden = hideDocumentPreviews || !area.querySelector("[data-document-preview-card]");
      });

      if (!hideDocumentPreviews) {
        updateRecruitmentDocumentLinks();
      }

      const hasActiveSetting = Object.keys(accessibilityClasses).some((key) => Boolean(settings[key])) || hideDocumentPreviews;
      accessibilityToggle.classList.toggle("active", hasActiveSetting);

      if (save) {
        localStorage.setItem("portfolio-accessibility", JSON.stringify(settings));
      }
    }

    function setTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark-mode", isDark);
      themeToggle.classList.toggle("active", isDark);
      localStorage.setItem("portfolio-theme", theme);
      updateThemeToggleLabel();
    }

    function updateHash(sectionKey, mode = "replace") {
      if (!sectionKey || sectionKey === "top") return;

      const hash = `#${sectionId(sectionKey)}`;
      if (window.location.hash === hash) return;

      const newUrl = `${window.location.pathname}${window.location.search}${hash}`;
      window.history[mode === "push" ? "pushState" : "replaceState"](null, "", newUrl);
    }

    function getInitialStateFromHash() {
      const hashId = window.location.hash.replace("#", "");
      if (!hashId) return null;

      const parts = hashId.split("-");
      const language = parts[0] === "en" ? "en" : parts[0] === "fr" ? "fr" : null;
      const sectionKey = parts.slice(1).join("-");

      if (!language) return null;

      const sectionMap = {
        about: "about",
        team: "team",
        equipe: "team",
        thesis: "thesis",
        these: "thesis",
        recruitment: "recruitment",
        recrutement: "recruitment",
        participer: "recruitment",
        participate: "recruitment",
        side: "side",
        training: "training",
        formations: "training",
        teaching: "teaching",
        enseignement: "teaching",
        publications: "publications",
        communications: "communications",
        contact: "contact"
      };

      return { language, sectionKey: sectionMap[sectionKey] || "top" };
    }

    function setLanguage(language, preserveSection = true, syncHash = true) {
      currentLanguage = language;
      const data = DATA[currentLanguage];

      updateMetadata(data);
      updateStaticI18n(data);
      updateThemeToggleLabel();
      updateShareButtonLabel();
      updateLanguageButtons();
      updateRecruitmentModeLabel();
      localStorage.setItem("portfolio-language", currentLanguage);
      render(data);
      updateAllFilterCounts();
      updateDisabledProjectTooltips();
      applyAccessibilitySettings(loadAccessibilitySettings(), false);

      if (preserveSection && currentSectionKey !== "top") {
        const target = document.getElementById(sectionId(currentSectionKey));
        if (target) {
          window.setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        }
      }

      if (syncHash) {
        updateHash(currentSectionKey);
      }

      window.setTimeout(() => {
        revealVisibleElements();
        detectCurrentSection();
      }, 80);
    }

    function updateDynamicBindings() {
      document.querySelector("[data-nav-toggle]")?.addEventListener("click", () => {
        document.querySelector("nav.site-nav")?.classList.toggle("open");
      });

      document.querySelectorAll("nav.site-nav a, .side-progress a").forEach((link) => {
        link.addEventListener("click", () => {
          currentSectionKey = link.dataset.sectionKey;
          updateActiveNavigation(currentSectionKey);
          closeMobileNavigation();
        });
      });

      document.querySelectorAll(".filter-button").forEach((button) => {
        button.addEventListener("click", () => {
          applyFilter(button.closest("section"), button.dataset.filter);
          button.animate(
            [
              { transform: "translateY(-2px) scale(1)" },
              { transform: "translateY(-2px) scale(1.04)" },
              { transform: "translateY(-2px) scale(1)" }
            ],
            { duration: 260, easing: "ease-out" }
          );
        });
      });

      document.querySelectorAll("[data-copy-email]").forEach((button) => {
        button.addEventListener("click", async () => {
          await copyTextToClipboard(button.dataset.copyEmail);
          button.textContent = button.dataset.copiedLabel;
          button.classList.add("active");

          window.setTimeout(() => {
            button.textContent = button.dataset.defaultLabel;
            button.classList.remove("active");
          }, 1600);
        });
      });

      document.querySelector("[data-site-search]")?.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          runSiteSearchFromInput();
        }
      });

      document.querySelector("[data-site-search]")?.addEventListener("input", (event) => {
        if (!event.target.value.trim()) {
          clearSiteSearch();
        }
      });

      document.querySelector("[data-search-submit]")?.addEventListener("click", runSiteSearchFromInput);

      document.querySelector("[data-search-prev]")?.addEventListener("click", () => goToSearchResult(-1));
      document.querySelector("[data-search-next]")?.addEventListener("click", () => goToSearchResult(1));

      document.querySelector("[data-search-clear]")?.addEventListener("click", clearSiteSearch);

      document.querySelectorAll("[data-cite-button]").forEach((button) => {
        button.addEventListener("click", async () => {
          await copyTextToClipboard(button.dataset.citation);
          button.textContent = button.dataset.copiedLabel;
          button.classList.add("active");

          window.setTimeout(() => {
            button.textContent = button.dataset.defaultLabel;
            button.classList.remove("active");
          }, 1800);
        });
      });

      document.querySelectorAll("[data-axis-action]").forEach((button) => {
        button.addEventListener("click", () => openOrCloseAxisProjects(button));
      });

      document.querySelectorAll("[data-participate-link]").forEach((link) => {
        link.addEventListener("click", (event) => handleParticipateLink(event, link));
      });

      document.querySelectorAll(".project-link.disabled").forEach((link) => {
        link.addEventListener("click", (event) => event.preventDefault());
      });

      document.querySelectorAll(".recruitment-link").forEach((link) => {
        link.addEventListener("click", (event) => {
          if (!link.classList.contains("is-closed")) {
            return;
          }

          event.preventDefault();
          const defaultLabel = link.dataset.defaultLabel;
          link.textContent = link.dataset.closedLabel || link.dataset.defaultLabel;
          link.classList.add("active");

          window.setTimeout(() => {
            link.textContent = defaultLabel;
            link.classList.remove("active");
          }, 1500);
        });
      });

      updateRecruitmentDocumentLinks();

      updateDisabledProjectTooltips();
      updateSideProgressVisibility();
      revealVisibleElements();
      updateActiveNavigation(currentSectionKey);
    }

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.switchLang, true, true));
    });

    accessibilityToggle.addEventListener("click", () => {
      const isHidden = accessibilityPanel.hidden;
      accessibilityPanel.hidden = !isHidden;
      accessibilityToggle.setAttribute("aria-expanded", String(isHidden));
    });

    accessibilityClose.addEventListener("click", () => {
      accessibilityPanel.hidden = true;
      accessibilityToggle.setAttribute("aria-expanded", "false");
      accessibilityToggle.focus();
    });

    accessibilityControls.forEach((control) => {
      control.addEventListener("change", () => {
        const settings = loadAccessibilitySettings();
        settings[control.dataset.accessibilityOption] = control.checked;
        applyAccessibilitySettings(settings);
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !accessibilityPanel.hidden) {
        accessibilityPanel.hidden = true;
        accessibilityToggle.setAttribute("aria-expanded", "false");
      }
    });

    themeToggle.addEventListener("click", () => {
      const newTheme = document.body.classList.contains("dark-mode") ? "light" : "dark";
      setTheme(newTheme);
    });

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-recruitment-mode-toggle]");
      if (!button) {
        return;
      }

      setRecruitmentMode(!document.body.classList.contains("recruitment-mode"), true, true);
    });

    shareButton.addEventListener("click", sharePortfolio);

    backToTopButton.addEventListener("click", () => {
      currentSectionKey = "top";
      updateActiveNavigation("top");
      document.getElementById(`${currentLanguage}-top`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    window.addEventListener("scroll", () => {
      revealVisibleElements();
      detectCurrentSection();
      updateStickySearchDensity();
      updateSideProgressVisibility();
      updateSectionProgressIndicator();
      backToTopButton.classList.toggle("visible", window.scrollY > 500);
    });

    window.addEventListener("resize", () => {
      revealVisibleElements();
      updateSideProgressVisibility();
    });

    window.addEventListener("load", () => {
      revealVisibleElements();
      detectCurrentSection();
      updateStickySearchDensity();
      updateSideProgressVisibility();
      updateSectionProgressIndicator();
      updateAllFilterCounts();
      updateDisabledProjectTooltips();
    });

    const initialHashState = shouldResetScrollOnRefresh ? null : getInitialStateFromHash();
    const initialRecruitmentMode = isRecruitmentModeFromUrl();
    const savedTheme = localStorage.getItem("portfolio-theme");
    const savedLanguage = localStorage.getItem("portfolio-language");
    const initialLanguage = initialHashState?.language || (savedLanguage === "en" ? "en" : "fr");

    if (shouldResetScrollOnRefresh && window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    currentLanguage = initialLanguage;
    currentSectionKey = initialHashState?.sectionKey || "top";

    setTheme(savedTheme === "dark" ? "dark" : "light");
    setLanguage(initialLanguage, false, false);
    applyAccessibilitySettings(loadAccessibilitySettings(), false);
    setRecruitmentMode(initialRecruitmentMode, false, initialRecruitmentMode);

    if (shouldResetScrollOnRefresh && !initialRecruitmentMode) {
      const forceTop = () => {
        currentSectionKey = "top";
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
        updateActiveNavigation("top");
      };

      forceTop();
      requestAnimationFrame(forceTop);
      window.setTimeout(forceTop, 120);
      window.setTimeout(forceTop, 350);
    } else if (!initialRecruitmentMode && initialHashState?.sectionKey && initialHashState.sectionKey !== "top") {
      window.setTimeout(() => {
        document.getElementById(sectionId(initialHashState.sectionKey))?.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }
  </script>
</body>
</html>
