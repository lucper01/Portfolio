<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luc Perroquin | Portfolio académique</title>
  <script>
    (async function () {
      const backupPath = "backups/index_backup_avant_ancrage_mobile_20260927_1105.html";
      const newFr = "nuitChercheursText: \"Présentation de l'effet émotionnel des odeurs et de sa mesure par des indicateurs physiologiques.\",";
      const newEn = "nuitChercheursText: \"Presentation of the emotional effect of odors and how it can be measured through physiological indicators.\",";
      const replacements = [
        ["nuitChercheursText: \"Communication réalisée dans le cadre de la Nuit des Chercheurs 2026, dont le thème général portait sur les émotions. Présentation autour de la visualisation de l'impact émotionnel des odeurs à partir de mesures physiologiques.\",", newFr],
        ["nuitChercheursText: \"Présentation de la manière dont les mesures physiologiques peuvent rendre visible et aider à interpréter l'impact émotionnel des odeurs.\",", newFr],
        ["nuitChercheursText: \"Scientific communication presented during Researchers' Night 2026, whose general theme focused on emotions. The presentation addressed the visualization of the emotional impact of odors through physiological measures.\",", newEn],
        ["nuitChercheursText: \"Presentation of how physiological measures can make the emotional impact of odors visible and help interpret it.\",", newEn]
      ];
      const mobileFix = `
    /* Correctif mobile : verrouillage horizontal du portfolio */
    @media (max-width: 760px) {
      html,
      body {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
        overscroll-behavior-x: none;
      }

      body {
        position: relative;
      }

      header {
        left: auto !important;
        right: auto !important;
        width: calc(100vw - 16px) !important;
        max-width: calc(100vw - 16px) !important;
        margin-left: 8px !important;
        margin-right: 8px !important;
        overflow: hidden !important;
      }

      main,
      footer,
      .top-controls,
      .customization-panel,
      .portfolio-search,
      header .hero,
      header nav.site-nav {
        max-width: 100vw !important;
      }

      header::before {
        left: 12px !important;
        right: 12px !important;
        width: auto !important;
      }

      header::after {
        max-width: 100vw !important;
      }
    }
`;

      try {
        const response = await fetch(backupPath, { cache: "no-store" });
        if (!response.ok) throw new Error("Backup load failed");
        let html = await response.text();
        replacements.forEach(([from, to]) => { html = html.replace(from, to); });
        if (!html.includes("Correctif mobile : verrouillage horizontal du portfolio")) {
          html = html.replace(/<\/style>/i, mobileFix + "\n  </style>");
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.documentElement.innerHTML = '<head><title>Portfolio</title><meta charset="UTF-8" /></head><body style="font-family:system-ui;padding:24px;line-height:1.5"><h1>Portfolio temporairement indisponible</h1><p>Rechargez la page dans quelques instants.</p></body>';
      }
    })();
  </script>
</head>

</html>
