<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="apple-touch-icon" href="assets/favicon.png" />

  <meta name="robots" content="noindex, nofollow, noarchive" />

  <meta id="og-description" property="og:description" content="Portfolio académique de Luc Perroquin, doctorant en psychologie cognitive, consacré à l'intégration entre olfaction, vision et audition." />
  <meta property="og:url" content="https://lucper01.github.io/Portfolio/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta id="twitter-title" name="twitter:title" content="Luc Perroquin | Portfolio académique" />
  <meta id="twitter-description" name="twitter:description" content="Portfolio académique de Luc Perroquin, doctorant en psychologie cognitive, consacré à l'intégration entre olfaction, vision et audition." />
  <meta name="twitter:image" content="https://lucper01.github.io/Portfolio/assets/photo-profil.png" />

  <title>Luc Perroquin | Portfolio académique</title>

  <style>
    :root {
      --page-width: 1320px;
      --green-deep: #061f17;
      --green-dark: #0b2f23;
      --green-main: #1f6f50;
      --green-light: #77b892;
      --green-soft: #dceee3;
      --green-pale: #f3faf5;
      --cream: #fbf7ed;
      --text: #1d261f;
      --muted: #5f6f65;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(11, 47, 35, 0.16);
      --shadow-soft: 0 12px 30px rgba(11, 47, 35, 0.10);
      --radius-large: 32px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(119, 184, 146, 0.22), transparent 32%),
        radial-gradient(circle at 90% 30%, rgba(220, 238, 227, 0.55), transparent 34%),
        linear-gradient(180deg, var(--cream), var(--green-pale));
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      --green-deep: #03100c;
      --green-dark: #dceee3;
      --green-main: #77b892;
      --green-light: #9fd3b1;
      --green-soft: #193f2e;
      --green-pale: #0b1f17;
      --cream: #07130f;
      --text: #edf8f0;
      --muted: #b8cabc;
      --white: #10251c;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
      --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.22);
      background:
        radial-gradient(circle at 10% 0%, rgba(119, 184, 146, 0.16), transparent 32%),
        radial-gradient(circle at 90% 30%, rgba(31, 111, 80, 0.18), transparent 34%),
        linear-gradient(180deg, #07130f, #0b1f17);
    }

    a {
      color: var(--green-main);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover { text-decoration: underline; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2000;
      transform: translateY(-140%);
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b2f23;
      font-weight: 900;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .top-controls {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .control-group {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(251, 247, 237, 0.96);
      border: 1px solid rgba(11, 47, 35, 0.14);
      box-shadow: 0 10px 30px rgba(11, 47, 35, 0.18);
      backdrop-filter: blur(10px);
    }

    body.dark-mode .control-group {
      background: rgba(7, 19, 15, 0.92);
      border-color: rgba(220, 238, 227, 0.18);
    }

    .control-group button {
      border: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: transparent;
      color: #0b2f23;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }

    body.dark-mode .control-group button { color: #dceee3; }

    .control-group button.active {
      background: var(--green-main);
      color: #ffffff;
    }
.accessibility-panel {
      position: fixed;
      top: 78px;
      right: 18px;
      z-index: 1100;
      width: min(360px, calc(100vw - 36px));
      padding: 18px;
      border-radius: 24px;
      background: rgba(251, 247, 237, 0.98);
      border: 1px solid rgba(11, 47, 35, 0.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    body.dark-mode .accessibility-panel {
      background: rgba(7, 19, 15, 0.98);
      border-color: rgba(220, 238, 227, 0.18);
    }

    .accessibility-panel[hidden] { display: none; }

    .accessibility-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .accessibility-header h2 {
      font-size: 1.2rem;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .accessibility-close {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .accessibility-intro {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .accessibility-options {
      display: grid;
      gap: 10px;
    }

    .accessibility-option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border-radius: 16px;
      background: var(--green-pale);
      border: 1px solid rgba(11, 47, 35, 0.10);
      cursor: pointer;
    }

    body.dark-mode .accessibility-option {
      background: rgba(119, 184, 146, 0.10);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .accessibility-option input {
      width: 20px;
      height: 20px;
      accent-color: var(--green-main);
      margin-top: 2px;
    }

    .accessibility-option strong {
      color: var(--green-dark);
      display: block;
      font-size: 0.95rem;
    }

    .accessibility-option small {
      color: var(--muted);
      display: block;
      line-height: 1.35;
      margin-top: 2px;
    }

    header {
      min-height: 88vh;
      display: grid;
      place-items: center;
      padding: 82px 8% 76px;
      color: #ffffff;
      background:
        radial-gradient(circle at top right, rgba(220, 238, 227, 0.28), transparent 30%),
        radial-gradient(circle at bottom left, rgba(119, 184, 146, 0.22), transparent 34%),
        linear-gradient(135deg, #061f17, #0b2f23 46%, #1f6f50);
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -160px;
      bottom: -160px;
      border-radius: 50%;
      background: rgba(220, 238, 227, 0.12);
      filter: blur(8px);
    }

    .hero {
      width: 100%;
      max-width: var(--page-width);
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(280px, 0.82fr);
      gap: 54px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .label {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #dceee3;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5.6vw, 4.35rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
      max-width: 850px;
    }

    .subtitle {
      margin: 0 0 18px;
      color: #dceee3;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 700;
      max-width: 760px;
    }

    .hero p {
      max-width: 760px;
      font-size: 1.12rem;
      color: rgba(255, 255, 255, 0.86);
    }

    .portrait-card {
      padding: 18px;
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transform: rotate(1.2deg);
    }

    .portrait-link { display: block; }

    .profile-photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      border-radius: 24px;
      border: 6px solid #dceee3;
      background: #dceee3;
    }

    .photo-note {
      margin-top: 12px;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
      font-weight: 750;
    }

    .portrait-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .portrait-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: #dceee3;
      color: #0b2f23;
      font-size: 0.88rem;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    .portrait-button.secondary {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .portrait-button:hover {
      text-decoration: none;
      transform: translateY(-2px);
    }

    .mobile-participate-button {
      display: none;
    }

    nav.site-nav {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 4;
      width: min(1180px, calc(100% - 64px));
      padding: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-toggle {
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: #dceee3;
      color: #0b2f23;
      font-weight: 900;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 5px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.45) transparent;
    }

    nav.site-nav a {
      padding: 9px 12px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
      flex: 0 0 auto;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    nav.site-nav a:hover,
    nav.site-nav a.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      text-decoration: none;
      transform: translateY(-1px);
    }

    .side-progress {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 900;
      display: grid;
      gap: 6px;
      width: 210px;
      max-height: calc(100vh - 160px);
      padding: 10px;
      border-radius: 24px;
      background: rgba(251, 247, 237, 0.94);
      border: 1px solid rgba(11, 47, 35, 0.12);
      box-shadow: var(--shadow-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow-y: auto;
    }

    body.show-side-progress .side-progress {
      opacity: 1;
      pointer-events: auto;
    }

    body.dark-mode .side-progress {
      background: rgba(7, 19, 15, 0.92);
      border-color: rgba(220, 238, 227, 0.14);
    }

    .side-progress a {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .side-progress a span {
      flex: 0 0 auto;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 0.72rem;
    }

    .side-progress a.active {
      background: var(--green-main);
      color: #ffffff;
      text-decoration: none;
    }

    .side-progress a.active span {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .portfolio-search {
      position: sticky;
      top: 0;
      z-index: 850;
      padding: 12px 5% 0;
      pointer-events: none;
    }

    .search-card {
      max-width: 740px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      gap: 6px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(251, 247, 237, 0.96);
      border: 1px solid rgba(11, 47, 35, 0.12);
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    body.dark-mode .search-card {
      background: rgba(7, 19, 15, 0.94);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .search-card input {
      min-width: 0;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.82);
      color: #0b2f23;
      font-weight: 750;
      outline: none;
    }

    body.dark-mode .search-card input {
      background: rgba(220, 238, 227, 0.10);
      color: #dceee3;
    }

    .search-card button {
      border: 0;
      border-radius: 999px;
      padding: 9px 12px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .search-card button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .search-result {
      grid-column: 1 / -1;
      padding: 2px 10px 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 760;
    }

    mark.search-highlight {
      background: #f9d66d;
      color: #1d261f;
      border-radius: 6px;
      padding: 0 3px;
    }

    mark.search-highlight.active-search-highlight {
      background: #1f6f50;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(31, 111, 80, 0.20);
    }

    main {
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 72px 5% 42px;
    }

    section {
      margin-bottom: 92px;
      scroll-margin-top: 110px;
    }

    .section-heading {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 22px;
    }

    .section-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 6vw, 5rem);
      color: rgba(31, 111, 80, 0.20);
      line-height: 0.85;
    }

    .section-heading h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1;
      color: var(--green-dark);
      margin: 0;
    }

    .lead {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 1040px;
    }

    .about-lead {
      max-width: 1120px;
      padding: 28px 30px;
      border-radius: 32px;
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.15), transparent 34%),
        rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(11, 47, 35, 0.08);
      box-shadow: var(--shadow-soft);
    }

    body.dark-mode .about-lead {
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.12), transparent 34%),
        rgba(16, 37, 28, 0.82);
      border-color: rgba(220, 238, 227, 0.10);
    }

    .about-lead strong {
      color: var(--green-dark);
      font-weight: 950;
      background: linear-gradient(180deg, transparent 58%, rgba(119, 184, 146, 0.24) 58%);
      border-radius: 4px;
    }

    body.dark-mode .about-lead strong {
      background: linear-gradient(180deg, transparent 58%, rgba(119, 184, 146, 0.22) 58%);
    }

    .team-card {
      padding: 34px;
      border-radius: var(--radius-large);
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.18), transparent 34%),
        rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(11, 47, 35, 0.10);
      box-shadow: var(--shadow-soft);
    }

    body.dark-mode .team-card {
      background:
        radial-gradient(circle at top right, rgba(119, 184, 146, 0.14), transparent 34%),
        rgba(16, 37, 28, 0.88);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .team-kicker {
      color: var(--green-main);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.82rem;
      font-weight: 900;
    }

    .team-card h3 {
      margin: 10px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--green-dark);
      font-size: clamp(1.65rem, 3vw, 2.45rem);
    }

    .team-card p {
      max-width: 970px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .team-link,
    .project-link,
    .recruitment-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--green-main);
      color: #ffffff;
      font-weight: 900;
      border: 1px solid var(--green-main);
    }

    .team-link:hover,
    .project-link:hover,
    .recruitment-link:hover {
      text-decoration: none;
      transform: translateY(-2px);
    }

    .thesis-card,
    .contact-box {
      padding: 34px;
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(11, 47, 35, 0.10);
      box-shadow: var(--shadow-soft);
    }

    body.dark-mode .thesis-card,
    body.dark-mode .contact-box {
      background: rgba(16, 37, 28, 0.88);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .thesis-card h3 {
      margin-top: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      color: var(--green-dark);
    }

    .supervision-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .supervisor-card {
      padding: 20px;
      border-radius: 24px;
      background: var(--green-pale);
      border: 1px solid rgba(11, 47, 35, 0.08);
      display: flex;
      gap: 16px;
      align-items: center;
      min-width: 0;
    }

    body.dark-mode .supervisor-card {
      background: rgba(119, 184, 146, 0.10);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .supervisor-photo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      object-fit: cover;
      background: var(--green-soft);
      border: 3px solid rgba(255, 255, 255, 0.76);
      flex: 0 0 auto;
    }

    .supervisor-card strong {
      display: block;
      color: var(--green-dark);
      font-size: 1.02rem;
      line-height: 1.2;
    }

    .supervisor-card span {
      display: block;
      color: var(--green-main);
      font-size: 0.82rem;
      font-weight: 900;
      margin: 0 0 4px;
    }

    .supervisor-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .axis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    .axis-card {
      padding: 28px;
      border-radius: var(--radius-large);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(11, 47, 35, 0.10);
      box-shadow: var(--shadow-soft);
    }

    body.dark-mode .axis-card {
      background: rgba(16, 37, 28, 0.88);
      border-color: rgba(220, 238, 227, 0.12);
    }

    .axis-badge,
    .project-status,
    .publication-type,
    .training-kicker {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 0.76rem;
      font-weight: 900;

    .filter-button.active {
      background: var(--green-main);

      display: grid;
      gap: 14px;

    .placeholder-item { border-style: dashed !important; }

    .contact-box {

      border: 1px solid rgba(11, 47, 35, 0.10);
      display: grid;

    body.dark-mode .contact-box {

      border-color: rgba(220, 238, 227, 0.12);
    }

    .contact-item {

      align-items: center;

      font-weight: 900;
      font-size: 0.82rem;
      flex: 0 0 auto;

    .contact-icon:hover {

      transform: translateY(-2px);
    }

    .copy-email-button,
    .footer-button {
      border: 1px solid rgba(11, 47, 35, 0.12);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.80);
      color: var(--green-dark);
      font-weight: 850;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;

    .footer-button:hover {
      transform: translateY(-1px);
      background: var(--green-soft);
    }

    body.dark-mode .footer-button {
      background: rgba(220, 238, 227, 0.10);
      border-color: rgba(220, 238, 227, 0.14);
      color: #dceee3;
    }

      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    footer {
      text-align: center;
      padding: 42px 5% 52px;
      color: var(--muted);
    }

    .back-to-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 980;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 0;
      background: var(--green-main);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-to-top:hover { transform: translateY(-2px); }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    body.a11y-large-text {
      font-size: 118%;

    }

    body.a11y-high-contrast {
      background: #ffffff !important;
      color: #000000 !important;

      --green-dark: #000000;
      --green-main: #004d31;

    }

    body.a11y-dyslexia {

      letter-spacing: 0.02em;
      word-spacing: 0.08em;
    }

    body.a11y-dyslexia h1,

      scroll-behavior: auto !important;
    }

    body.a11y-hide-previews .document-preview {
      display: none !important;
    }

    .a11y-feedback {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);

      max-width: min(460px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--green-main);
      color: #ffffff;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .a11y-feedback[hidden] { display: none; }

    @media (max-width: 1180px) {
      .side-progress { display: none; }
      .portfolio-search { top: 0; }
    }

        min-height: auto;

        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

          "informations sensorielles",

          "espace, du temps et des événements"
        ]
        : [
          "understanding human beings",
          "cognitive psychology",
          "cognitive ergonomics",
          "relations between individuals and their environments",
          "sensory information",
          "odors, sounds, and images",
          "space, time, and events"
        ];

      let escaped = escapeHtml(value);

      highlights
        .sort((a, b) => b.length - a.length)
        .forEach((term) => {
          const escapedTerm = escapeHtml(term);
          escaped = escaped.replace(new RegExp(escapedTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g"), `<strong>${escapedTerm}</strong>`);
        });

      return escaped;

    function parseTeachingHours(value) {
      const match = String(value || "").replace(",", ".").match(/[\d.]+/);
      return match ? Number(match[0]) : 0;
    }

    function formatHourValue(value, suffix = "h") {
      const numericValue = Number(value) || 0;
      const isInteger = Number.isInteger(numericValue);
      const formatted = numericValue.toLocaleString(currentLanguage === "fr" ? "fr-FR" : "en-GB", {
        minimumFractionDigits: 0,
        maximumFractionDigits: isInteger ? 0 : 1
      });

      return `${formatted} ${suffix}`;
    }

    function getTeachingYearValuedHours(block) {
      return block.entries.reduce((total, entry) => {
        return total + (entry.valued === false ? 0 : parseTeachingHours(entry.hours));
      }, 0);
    }

    function getTeachingTotals() {
      const hours = TEACHING.reduce((total, block) => total + getTeachingYearValuedHours(block), 0);
      const interventions = TEACHING.reduce((total, block) => total + block.entries.length, 0);

      return {
        hours,
        years: TEACHING.length,
        interventions
      };
    }

    function getTrainingYearGroups() {
      const groups = TRAININGS.reduce((accumulator, training) => {
        const year = training.year || "2025-2026";

        if (!accumulator[year]) {
          accumulator[year] = [];
        }

        accumulator[year].push(training);
        return accumulator;
      }, {});

      return Object.entries(groups)
        .sort(([yearA], [yearB]) => yearA.localeCompare(yearB))
        .map(([year, entries]) => ({
          year,
          entries,
          totalHours: entries.reduce((total, training) => total + parseTeachingHours(training.hours), 0)
        }));
    }

    function getTrainingTotals() {
      const groups = getTrainingYearGroups();
      const hours = groups.reduce((total, group) => total + group.totalHours, 0);
      const modules = TRAININGS.length;

      return {
        hours,
        years: groups.length,
        modules
      };
    }

    function getTrainingAndTeachingPeriod() {
      const years = [
        ...TEACHING.map((block) => block.year),
        ...getTrainingYearGroups().map((group) => group.year)
      ].filter(Boolean).sort();

      if (!years.length) {
        return currentLanguage === "fr" ? "À compléter" : "To be completed";
      }

      const firstStart = years[0].split("-")[0];
      const lastEnd = years[years.length - 1].split("-")[1] || years[years.length - 1];

      return firstStart && lastEnd ? `${firstStart}-${lastEnd}` : years[0];
    }

    function updateDynamicBindings() {
      document.querySelectorAll("[data-nav-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          button.closest(".site-nav")?.classList.toggle("open");
        });
      });

      document.querySelectorAll(".site-nav a, .side-progress a").forEach((link) => {
        link.addEventListener("click", () => {
          document.querySelectorAll(".site-nav").forEach((nav) => nav.classList.remove("open"));
        });
      });

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          applyFilters(button.dataset.filter);
          button.closest(".filter-menu")?.removeAttribute("open");
        });
      });

      document.querySelectorAll("[data-copy-email]").forEach((button) => {
        button.addEventListener("click", () => copyValue(button));
      });

      document.querySelectorAll("[data-cite-button]").forEach((button) => {
        button.addEventListener("click", () => copyCitation(button));
      });

      document.querySelectorAll("[data-share-button]").forEach((button) => {
        button.addEventListener("click", sharePortfolio);
      });

      document.querySelectorAll("[data-open-axis-projects]").forEach((button) => {
        button.addEventListener("click", () => toggleAxisProjects(button.dataset.openAxisProjects, true));
      });

      document.querySelectorAll("[data-close-axis-projects]").forEach((button) => {
        button.addEventListener("click", () => toggleAxisProjects(button.dataset.closeAxisProjects, false));
      });

      document.querySelectorAll("[data-recruitment-panel-toggle]").forEach((button) => {
        button.addEventListener("click", () => toggleRecruitmentPanel(button));
      });

      document.querySelectorAll("[data-site-search]").forEach((input) => {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            runSiteSearch(input.value);
          }
        });
      });

      document.querySelectorAll("[data-search-submit]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = button.closest("[data-search-panel]")?.querySelector("[data-site-search]");
          runSiteSearch(input?.value || "");
        });
      });

      document.querySelectorAll("[data-search-prev]").forEach((button) => {
        button.addEventListener("click", () => navigateSearch(-1));
      });

      document.querySelectorAll("[data-search-next]").forEach((button) => {
        button.addEventListener("click", () => navigateSearch(1));
      });

      document.querySelectorAll("[data-search-clear]").forEach((button) => {
        button.addEventListener("click", clearSiteSearch);
      });
    }

    function applyFilters(filter) {
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      document.querySelectorAll(".filter-item").forEach((item) => {
        const itemAxis = item.dataset.axis;
        const itemStatus = item.dataset.status;
        const itemCategory = item.dataset.category;
        const shouldShow =
          filter === "all" ||
          itemAxis === filter ||
          itemStatus === filter ||
          itemCategory === filter;

        item.classList.toggle("hidden-by-filter", !shouldShow);
      });
    }

      document.querySelectorAll(`[data-axis-projects-panel="${axis}"] .project-card`).forEach((card) => {

    function runSiteSearch(query) {
      clearSearchHighlights(false);
      const trimmed = query.trim();
      const resultBox = document.querySelector("[data-search-result]");

      if (!trimmed) {
        updateSearchResult(0, 0);
        return;
      }

      const regex = new RegExp(trimmed.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      const searchableRoot = document.querySelector("main");
      const textNodes = [];
      const walker = document.createTreeWalker(searchableRoot, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (node.parentElement?.closest("script, style, mark")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      textNodes.forEach((node) => {
        const text = node.nodeValue;
        if (!regex.test(text)) return;
        regex.lastIndex = 0;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        text.replace(regex, (match, offset) => {
          fragment.append(document.createTextNode(text.slice(lastIndex, offset)));
          const mark = document.createElement("mark");
          mark.className = "search-highlight";
          mark.textContent = match;
          fragment.append(mark);
          lastIndex = offset + match.length;
          return match;
        });
        fragment.append(document.createTextNode(text.slice(lastIndex)));
        node.parentNode.replaceChild(fragment, node);
      });

      currentSearchResults = Array.from(document.querySelectorAll("mark.search-highlight"));
      currentSearchIndex = 0;
      currentSearchOccurrenceCount = currentSearchResults.length;
      updateSearchResult(currentSearchOccurrenceCount ? 1 : 0, currentSearchOccurrenceCount);

      if (currentSearchResults.length) {
        focusSearchResult(0);
      }
    }

    function focusSearchResult(index) {
      currentSearchResults.forEach((mark) => mark.classList.remove("active-search-highlight"));
      const target = currentSearchResults[index];
      if (!target) return;
      target.classList.add("active-search-highlight");
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      updateSearchResult(index + 1, currentSearchOccurrenceCount);
    }

    function navigateSearch(direction) {
      if (!currentSearchResults.length) return;
      currentSearchIndex = (currentSearchIndex + direction + currentSearchResults.length) % currentSearchResults.length;
      focusSearchResult(currentSearchIndex);
    }

    function updateSearchResult(current, total) {
      const data = DATA[currentLanguage];
      const resultBox = document.querySelector("[data-search-result]");
      const prev = document.querySelector("[data-search-prev]");
      const next = document.querySelector("[data-search-next]");
      if (!resultBox) return;

      if (!total) {
        resultBox.hidden = true;
        resultBox.textContent = "";
        prev?.setAttribute("disabled", "");
        next?.setAttribute("disabled", "");
        return;
      }

      const label = total > 1 ? data.resultWord[1] : data.resultWord[0];
      resultBox.hidden = false;
      resultBox.textContent = `${current}/${total} ${label}`;
      prev?.removeAttribute("disabled");
      next?.removeAttribute("disabled");
    }

    function clearSearchHighlights(clearInput = true) {
      document.querySelectorAll("mark.search-highlight").forEach((mark) => {
        mark.replaceWith(document.createTextNode(mark.textContent));
      });
      currentSearchResults = [];
      currentSearchIndex = 0;
      currentSearchOccurrenceCount = 0;
      if (clearInput) {
        document.querySelectorAll("[data-site-search]").forEach((input) => input.value = "");
      }
      updateSearchResult(0, 0);
    }

    function clearSiteSearch() {
      clearSearchHighlights(true);
    }

    function observeReveals() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));
    }

    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          currentSectionKey = entry.target.dataset.section;
          updateActiveNavigation();
        }
      });
    }, { rootMargin: "-45% 0px -45% 0px", threshold: 0.01 });

    function observeSections() {
      sectionObserver.disconnect();
      document.querySelectorAll("[data-section]").forEach((section) => sectionObserver.observe(section));
    }

    function updateActiveNavigation() {
      document.querySelectorAll("[data-section-key]").forEach((link) => {
        link.classList.toggle("active", link.dataset.sectionKey === currentSectionKey);
      });
    }

    function updateSideProgressVisibility() {
      const header = document.querySelector("header");
      if (!header) return;
      const rect = header.getBoundingClientRect();
      document.body.classList.toggle("show-side-progress", rect.bottom < 120);
      backToTopButton.classList.toggle("visible", window.scrollY > 600);
    }

    function getLastUpdateLabel(data) {
      const date = new Date(document.lastModified);
      if (Number.isNaN(date.getTime())) {
        return data.version;
      }
      const formatted = new Intl.DateTimeFormat(data.lang === "fr" ? "fr-FR" : "en-GB", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);
      return data.lang === "fr" ? `Dernière mise à jour : ${formatted}` : `Last update: ${formatted}`;
    }

    function updateMetadata(data) {
      document.title = data.title;
      document.getElementById("meta-description")?.setAttribute("content", data.description);
      document.getElementById("meta-keywords")?.setAttribute("content", data.keywords);
      document.getElementById("og-title")?.setAttribute("content", data.title);
      document.getElementById("og-description")?.setAttribute("content", data.description);
      document.getElementById("og-locale")?.setAttribute("content", data.locale);
      document.getElementById("twitter-title")?.setAttribute("content", data.title);
      document.getElementById("twitter-description")?.setAttribute("content", data.description);
    }

    function setLanguage(lang) {
      currentLanguage = DATA[lang] ? lang : "fr";
      localStorage.setItem("portfolio-language", currentLanguage);
      languageButtons.forEach((button) => button.classList.toggle("active", button.dataset.switchLang === currentLanguage));
      updateMetadata(DATA[currentLanguage]);
      render(DATA[currentLanguage]);
      observeSections();
    }

    function updateStaticI18n(data) {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        if (data[key]) element.textContent = data[key];
      });
      document.querySelector(".skip-link")?.setAttribute("href", "#main");
      document.querySelector("[data-back-to-top]")?.setAttribute("aria-label", data.backToTopLabel);
      document.querySelector("[data-accessibility-panel]")?.setAttribute("aria-label", data.customizationAriaLabel);
      document.querySelector("[data-accessibility-close]")?.setAttribute("aria-label", data.customizationCloseLabel);
      document.querySelector("[data-customization-trigger-group]")?.setAttribute("aria-label", data.customizationAriaLabel);
      document.querySelector("[data-recruitment-dock]")?.setAttribute("aria-label", data.recruitmentDockAriaLabel);
    }

    function updateThemeButtonLabel() {
      const data = DATA[currentLanguage];
      const isDark = document.body.classList.contains("dark-mode");
      if (themeToggle) {
        themeToggle.textContent = isDark ? data.themeLight : data.themeDark;
      }
    }

    function showAccessibilityFeedback(message) {
      if (!accessibilityFeedback) return;
      accessibilityFeedback.textContent = message;
      accessibilityFeedback.hidden = false;
      clearTimeout(feedbackTimeout);
      feedbackTimeout = setTimeout(() => {
        accessibilityFeedback.hidden = true;
      }, 1800);
    }

    function saveAccessibilitySettings(settings) {
      localStorage.setItem("portfolio-accessibility", JSON.stringify(settings));
      localStorage.setItem("portfolio-hide-document-previews", settings.hideDocumentPreviews ? "true" : "false");
    }

    function applyAccessibilitySettings(settings) {
      Object.entries(accessibilityClasses).forEach(([key, className]) => {
        document.body.classList.toggle(className, Boolean(settings[key]));
      });
      document.body.classList.toggle("a11y-hide-previews", Boolean(settings.hideDocumentPreviews));
      accessibilityControls.forEach((control) => {
        control.checked = Boolean(settings[control.dataset.accessibilityOption]);
      });
      saveAccessibilitySettings(settings);
    }

    function getCurrentAccessibilitySettings() {
      return JSON.parse(localStorage.getItem("portfolio-accessibility") || "{}");
    }

    function setRecruitmentMode(active) {
      document.body.classList.toggle("recruitment-mode", active);
      const url = new URL(window.location.href);
      if (active) {
        url.searchParams.set("mode", "recrutement");
        history.replaceState({}, "", url);
        setTimeout(() => document.getElementById(sectionId("recruitment"))?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
      } else {
        url.searchParams.delete("mode");
        history.replaceState({}, "", url);
      }
      updateRecruitmentModeLabel();
    }

    function updateRecruitmentModeLabel() {
      const data = DATA[currentLanguage];
      const isActive = document.body.classList.contains("recruitment-mode");

      document.querySelectorAll("[data-recruitment-mode-toggle]").forEach((button) => {
        const label = isActive ? data.fullPortfolioMode : data.recruitmentMode;

        if (button.closest(".recruitment-mode-dock")) {
          const hint = isActive ? data.recruitmentDockActiveHint : data.recruitmentDockHint;
          button.innerHTML = `
            <span class="recruitment-dock-icon" aria-hidden="true"></span>
            <span class="recruitment-dock-copy">
              <span class="recruitment-dock-title">${escapeHtml(label)}</span>
              <span class="recruitment-dock-hint">${escapeHtml(hint)}</span>
            </span>
          `;
        } else {
          button.textContent = label;
        }

        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.switchLang));
    });

    themeToggle?.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("portfolio-theme", isDark ? "dark" : "light");
      updateThemeButtonLabel();
    });

    accessibilityToggle?.addEventListener("click", () => {
      const isHidden = accessibilityPanel.hidden;
      accessibilityPanel.hidden = !isHidden;
      accessibilityToggle.setAttribute("aria-expanded", String(isHidden));
    });

    accessibilityClose?.addEventListener("click", () => {
      accessibilityPanel.hidden = true;
      accessibilityToggle?.setAttribute("aria-expanded", "false");
    });

    accessibilityControls.forEach((control) => {
      control.addEventListener("change", () => {
        const settings = getCurrentAccessibilitySettings();
        settings[control.dataset.accessibilityOption] = control.checked;
        applyAccessibilitySettings(settings);
        const data = DATA[currentLanguage];
        const label = control.closest("label")?.querySelector("strong")?.textContent || data.accessibility;
        showAccessibilityFeedback(label);
      });
    });

    accessibilityEnableAll?.addEventListener("click", () => {
      applyAccessibilitySettings({
        largeText: true,
        highContrast: true,
        dyslexia: true,
        reduceMotion: true,
        hideDocumentPreviews: true
      });
    });

    accessibilityReset?.addEventListener("click", () => {
      applyAccessibilitySettings({});
    });

    document.querySelectorAll("[data-recruitment-mode-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        setRecruitmentMode(!document.body.classList.contains("recruitment-mode"));
      });
    });

    backToTopButton?.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("scroll", updateSideProgressVisibility, { passive: true });
    window.addEventListener("resize", updateSideProgressVisibility);

    const initialLang = DATA[savedLanguage] ? savedLanguage : "fr";
    applyAccessibilitySettings(savedAccessibility);
    setLanguage(initialLang);

    const initialMode = new URL(window.location.href).searchParams.get("mode");
    if (initialMode === "recrutement" || initialMode === "recruitment") {
      setRecruitmentMode(true);
    }
  </script>
</body>
</html>
