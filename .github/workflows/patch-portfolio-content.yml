name: Patch portfolio content

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_portfolio_content.py
      - .github/workflows/patch-portfolio-content.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply content-only patch
        run: python3 scripts/patch_portfolio_content.py

      - name: Commit content changes
        run: |
          if git diff --quiet -- index.html backups; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "luc.perroquin"
          git config user.email "luc.perroquin@gmail.com"
          git add index.html backups/
          git commit -m "Update portfolio content only"
          git push
